name: Unzip LFS ROM File

on:
  workflow_dispatch:

jobs:
  unzip-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Ensure LFS Pull
      run: git lfs pull

    - name: Unzip ROM File
      run: |
        mkdir -p pixelos_extracted
        unzip -q pixelos.zip -d ./pixelos_extracted
        # تنظيف لضمان عدم تكرار الملف المضغوط الأصلي في عملية الرفع
        rm pixelos.zip 

    - name: Commit and Push Extracted Files
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # إضافة الملفات تدريجياً لتجنب انهيار الخادم بسبب الأعداد الضخمة
        git add pixelos_extracted/
        
        # التحقق مما إذا كانت هناك تغييرات فعلاً قبل عمل Commit
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "استخراج ملفات الروم بنجاح وتجاوز حدود الرفع"
          git push
        fi
